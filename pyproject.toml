[project]
name = "bt-hid-kvm"
version = "0.1.0"
description = "Use this Linux PC's keyboard and mouse on another computer as a Bluetooth HID device"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbus-python>=1.5.1",
    "evdev>=2.0.0",
    "pygobject>=3.58.1",
]

[project.scripts]
bt-hid-kvm = "bt_hid_kvm.__main__:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv]
# uv-managed CPython has no socket.AF_BLUETOOTH; .python-version pins the distro Python.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
